name: Wiki source review

on:
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      full_audit:
        description: Review bounded current repository state, including unchanged sources
        required: false
        type: boolean
        default: false
      open_pr:
        description: Open a draft findings PR instead of performing a dry run
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: wiki-source-review
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze public Wiki sources
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      vars.WIKI_AI_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: wiki-ai-review
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      source_count: ${{ steps.collect.outputs.source_count }}
      skipped: ${{ steps.existing.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Refuse to compete with an open review PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --json headRefName \
            --limit 100 \
            --jq '[.[] | select(.headRefName | startswith("automation/wiki-review-"))] | length')
          if [[ "$count" != "0" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An automated Wiki review PR is already open." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sign in to Azure with workload identity
        if: steps.existing.outputs.skip != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run live labelled correctness checks
        if: steps.existing.outputs.skip != 'true'
        env:
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EXPECTED_MODEL: ${{ vars.AZURE_OPENAI_EXPECTED_MODEL }}
          REQUIRE_SCHEDULING_APPROVAL: >-
            ${{ github.event_name == 'schedule' || inputs.open_pr }}
        run: |
          options=()
          if [[ "$REQUIRE_SCHEDULING_APPROVAL" == "true" ]]; then
            options+=(--require-scheduling-approval)
          fi
          python scripts/review_wiki.py evaluate \
            --cases tests/fixtures/wiki-review-evals.json \
            --endpoint "$AZURE_OPENAI_ENDPOINT" \
            --deployment "$AZURE_OPENAI_DEPLOYMENT" \
            --expected-model "$AZURE_OPENAI_EXPECTED_MODEL" \
            --output "$RUNNER_TEMP/wiki-eval.json" \
            "${options[@]}"
      - name: Collect public source evidence
        id: collect
        if: steps.existing.outputs.skip != 'true'
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/wiki-evidence.json
          FULL_AUDIT: >-
            ${{ inputs.full_audit || github.event.schedule == '0 8 1 * *' }}
          REQUIRE_COMPLETE_INVENTORY: >-
            ${{ github.event_name == 'schedule' || inputs.open_pr }}
        run: |
          options=()
          if [[ "$FULL_AUDIT" == "true" ]]; then
            options+=(--full-audit)
          fi
          if [[ "$REQUIRE_COMPLETE_INVENTORY" == "true" ]]; then
            options+=(--require-complete-inventory)
          fi
          python scripts/review_wiki.py collect-repositories \
            --manifest docs/wiki-sources.json \
            --wiki docs/wiki \
            --output "$RUNNER_TEMP/wiki-evidence.json" \
            "${options[@]}"
          count=$(python -c \
            'import json, os; print(len(json.load(open(os.environ["EVIDENCE_PATH"]))["sources"]))')
          echo "source_count=$count" >> "$GITHUB_OUTPUT"
      - name: Review source evidence twice
        if: steps.existing.outputs.skip != 'true'
        env:
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EXPECTED_MODEL: ${{ vars.AZURE_OPENAI_EXPECTED_MODEL }}
        run: >-
          python scripts/review_wiki.py review
          --evidence "$RUNNER_TEMP/wiki-evidence.json"
          --endpoint "$AZURE_OPENAI_ENDPOINT"
          --deployment "$AZURE_OPENAI_DEPLOYMENT"
          --expected-model "$AZURE_OPENAI_EXPECTED_MODEL"
          --output "$RUNNER_TEMP/wiki-review.json"
      - name: Render findings-only proposal
        if: steps.existing.outputs.skip != 'true'
        run: >-
          python scripts/review_wiki.py report
          --evidence "$RUNNER_TEMP/wiki-evidence.json"
          --review "$RUNNER_TEMP/wiki-review.json"
          --evaluation "$RUNNER_TEMP/wiki-eval.json"
          --output docs/wiki-review-proposal.md
      - name: Validate Wiki source and offline controls
        if: steps.existing.outputs.skip != 'true'
        run: |
          python scripts/sync_wiki.py validate docs/wiki
          python -m pip install --disable-pip-version-check \
            cryptography==48.0.0 pytest==9.0.3
          python -m pytest \
            tests/test_sync_wiki.py \
            tests/test_review_wiki.py \
            tests/test_collect_wiki_projection.py
      - name: Record dry-run result
        if: >-
          github.event_name == 'workflow_dispatch' &&
          !inputs.open_pr &&
          steps.existing.outputs.skip != 'true'
        run: |
          cat docs/wiki-review-proposal.md >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run complete; no branch or PR was created." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload public proposal for the write-scoped job
        if: >-
          steps.collect.outputs.source_count != '0' &&
          (github.event_name == 'schedule' || inputs.open_pr)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-review-proposal-${{ github.run_id }}
          path: docs/wiki-review-proposal.md
          if-no-files-found: error
          retention-days: 1
      - name: Record no-op result
        if: >-
          steps.existing.outputs.skip != 'true' &&
          steps.collect.outputs.source_count == '0'
        run: echo "No source revisions require review." >> "$GITHUB_STEP_SUMMARY"

  propose:
    name: Open draft findings PR
    needs: analyze
    if: >-
      needs.analyze.outputs.skipped != 'true' &&
      needs.analyze.outputs.source_count != '0' &&
      (github.event_name == 'schedule' || inputs.open_pr)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the public findings report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wiki-review-proposal-${{ github.run_id }}
          path: docs
      - name: Create draft findings PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/wiki-review-${GITHUB_RUN_ID}"
          gh auth setup-git
          git fetch --no-tags --depth=1 origin main
          current_main=$(git rev-parse FETCH_HEAD)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Refusing to propose from stale main revision $GITHUB_SHA." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- docs/wiki-review-proposal.md
          if git diff --cached --quiet; then
            echo "The findings report is unchanged; no pull request was opened." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Report Wiki source findings"
          git push origin "$branch"
          gh pr create \
            --draft \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "Review Wiki source findings $(date -u +%Y-%m-%d)" \
            --body-file docs/wiki-review-proposal.md
